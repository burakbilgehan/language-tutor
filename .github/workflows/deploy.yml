# Push to main → deploy okumo.dev (Worker + static assets from out/).
# Replaces the removed GitHub Pages flow (pages.yml): production is the
# Cloudflare Worker serving out/ as static assets (worker/wrangler.jsonc,
# env.production). Requires the CLOUDFLARE_API_TOKEN repo secret ("Edit
# Cloudflare Workers" token template); add CLOUDFLARE_ACCOUNT_ID too if the
# token can see more than one account.
name: Deploy okumo.dev

on:
  push:
    branches: [main]
    paths-ignore:
      - "tickets/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install app dependencies
        run: npm ci

      # data/app.db is gitignored; db-reset.test.ts (and anything touching the
      # dev DB) needs the schema to exist. --force skips the interactive
      # confirmation — the DB is always fresh here, nothing to lose.
      - name: Create app DB schema
        run: npm run db:push -- --force

      - name: App tests
        run: npm test

      - name: Build static site
        run: npm run build:static

      - name: Install worker dependencies
        run: npm ci
        working-directory: worker

      - name: Worker tests
        run: npm test
        working-directory: worker

      - name: Deploy worker + assets
        run: npx wrangler deploy --env production
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
